{% extends "base.html" %}

{% block title %}📬 ارسال پیام{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card-custom message-form p-4 p-md-5">
                <h2 class="page-title text-center mb-4">
                    <i class="bi bi-envelope ms-2"></i>ارسال پیام
                </h2>
                
                <div class="recipient-info p-3 mb-4">
                    <div class="d-flex align-items-center">
                        <img src="https://ui-avatars.com/api/?name={{ receiver.name|urlencode }}&background=10B981&color=fff&size=128" alt="{{ receiver.name }}" class="recipient-avatar rounded-circle">
                        <div class="recipient-details ms-3">
                            <h4 class="mb-1">{{ receiver.name }}</h4>
                            <p class="mb-0 text-muted">در حال ارسال پیام به این کاربر</p>
                        </div>
                    </div>
                </div>
                
                <form method="POST">
                    <div class="mb-4">
                        <label for="message" class="form-label fw-semibold">
                            <i class="bi bi-chat-dots ms-2"></i>متن پیام
                        </label>
                        <textarea name="message" id="message" class="form-control form-control-custom message-textarea" rows="6" placeholder="پیام خود را اینجا بنویسید..." required></textarea>
                    </div>
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-custom-secondary">
                            <i class="bi bi-send ms-2"></i>ارسال پیام
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    .message-form {
        max-width: 700px;
        margin: 0 auto;
    }
    
    .recipient-info {
        background-color: rgba(16, 185, 129, 0.1);
        border-radius: var(--radius);
        border-right: 4px solid var(--secondary-color);
    }
    
    .recipient-avatar {
        width: 70px;
        height: 70px;
        object-fit: cover;
        box-shadow: var(--shadow-md);
    }
    
    .message-textarea {
        min-height: 150px;
        resize: vertical;
    }
    
    .message-form {
        animation: fadeIn 0.5s ease-out;
    }
    
    .recipient-info {
        animation: fadeIn 0.5s ease-out;
        animation-delay: 0.1s;
    }
    
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    
    /* Responsive adjustments */
    @media (max-width: 768px) {
        .recipient-info .d-flex {
            flex-direction: column;
            text-align: center;
        }
        
        .recipient-details {
            margin-top: 1rem;
            margin-right: 0;
        }
    }
</style>

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const messageTextarea = document.getElementById('message');
    const messageForm = document.querySelector('form');
    
    // Auto-resize textarea as user types
    messageTextarea.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = (this.scrollHeight) + 'px';
    });
    
    // Add loading state to submit button
    messageForm.addEventListener('submit', function() {
        const submitBtn = this.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="bi bi-hourglass-split ms-2"></i>در حال ارسال...';
    });
});
</script>
{% endblock %}
{% endblock %}
