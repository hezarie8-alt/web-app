{% extends "base.html" %}

{% block title %}🎓 همکلاسی یاب | صفحه اصلی{% endblock %}

{% block content %}
<section class="hero-section text-center text-white">
    <div class="container">
        <h1 class="display-4 fw-bold">به همکلاسی یاب خوش آمدید!</h1>
        <p class="lead my-4">پلتفرمی برای پیدا کردن و ارتباط با همکلاسی‌های خود در دانشگاه.</p>
        {% if not session.get('current_user_id') %}
            <a href="{{ url_for('show_auth_page') }}" class="btn btn-light btn-lg">
                <i class="bi bi-rocket-takeoff ms-2"></i>شروع کن
            </a>
        {% else %}
            <a href="{{ url_for('match') }}" class="btn btn-light btn-lg">
                <i class="bi bi-search ms-2"></i>جستجوی همکلاسی
            </a>
        {% endif %}
    </div>
</section>
{% endblock %}
